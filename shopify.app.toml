# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3b46a7d5b955f46d2298724437e64a02"
name = "Seoi — SEO & PaySync"
application_url = "https://seoi.in/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions/update"
  topics = [ "app_subscriptions/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# PaySync needs order scopes. After Shopify approves "read all orders", include read_all_orders.
# Reopen the app so the merchant re-approves OAuth scopes.
scopes = "read_content,read_inventory,read_locations,read_online_store_navigation,read_products,write_app_proxy,write_inventory,write_online_store_navigation,write_products,read_orders,write_orders,read_all_orders,read_fulfillments"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://seoi.in/auth/callback" ]

[app_proxy]
url = "https://seoi.in/proxy/seoi"
subpath = "seoi"
prefix = "apps"
